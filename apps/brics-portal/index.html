<!DOCTYPE html>
<html lang="en" class="bg-[#f8fafc] dark:bg-[#070d18]">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AURA Sovereign — BRICS Federated AI Grid &amp; Cryptographic Ledger</title>
    <script>
      (function() {
        try {
          var stored = localStorage.getItem('brics-theme');
          if (stored) {
            var parsed = JSON.parse(stored);
            if (parsed && parsed.state && parsed.state.isDark) {
              document.documentElement.classList.add('dark');
            }
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="bg-[#f8fafc] dark:bg-[#070d18] text-slate-900 dark:text-slate-100 antialiased selection:bg-blue-600 selection:text-white">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
