<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="brics_gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#b45309" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
  </defs>
  <!-- Rounded Base Shield -->
  <rect width="64" height="64" rx="14" fill="#0c1322" />
  <!-- 5-Node Interconnected Sovereign Enclave -->
  <circle cx="32" cy="32" r="20" stroke="#f59e0b" stroke-width="2" stroke-dasharray="3 2" fill="#09101d" />
  <!-- Central Cryptographic Core -->
  <polygon points="32,22 41,27 41,37 32,42 23,37 23,27" fill="url(#brics_gold)" stroke="#fbbf24" stroke-width="1.5" />
  <circle cx="32" cy="32" r="3.5" fill="#ffffff" />
  <!-- 5 Sovereign Nations Enclave Nodes -->
  <!-- India (Top) -->
  <circle cx="32" cy="12" r="4" fill="#f59e0b" stroke="#ffffff" stroke-width="1.5" />
  <!-- Brazil (Top Right) -->
  <circle cx="51" cy="26" r="4" fill="#10b981" stroke="#ffffff" stroke-width="1.5" />
  <!-- South Africa (Bottom Right) -->
  <circle cx="44" cy="48" r="4" fill="#06b6d4" stroke="#ffffff" stroke-width="1.5" />
  <!-- Russia (Bottom Left) -->
  <circle cx="20" cy="48" r="4" fill="#3b82f6" stroke="#ffffff" stroke-width="1.5" />
  <!-- China (Top Left) -->
  <circle cx="13" cy="26" r="4" fill="#ef4444" stroke="#ffffff" stroke-width="1.5" />
</svg>
