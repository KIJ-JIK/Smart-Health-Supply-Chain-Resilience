version: '3.8'

services:
  # ── DATABASE & CACHE ──────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: smarthealth-postgres
    environment:
      POSTGRES_USER: health_admin
      POSTGRES_PASSWORD: health_secure_password
      POSTGRES_DB: smarthealth
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: smarthealth-redis
    ports:
      - "6379:6379"

  # ── CENTRAL BACKEND API & SYNC ────────────────
  backend:
    build: ./services/backend
    container_name: smarthealth-backend
    ports:
      - "8000:8000"
    environment:
      PORT: 8000
      DATABASE_URL: postgres://health_admin:health_secure_password@postgres:5432/smarthealth
      REDIS_URL: redis://redis:6379
    depends_on:
      - postgres
      - redis

  # ── AI & OPTIMIZATION ENGINE ─────────────────
  ai-engine:
    build: ./services/ai-engine
    container_name: smarthealth-ai
    ports:
      - "5000:5000"

  # ── WEB PORTALS ──────────────────────────────
  phc-portal:
    build: ./apps/phc-portal
    container_name: smarthealth-phc-portal
    ports:
      - "5173:5173"

  governance-portal:
    build: ./apps/governance-portal
    container_name: smarthealth-gov-portal
    ports:
      - "3000:3000"

  brics-portal:
    build: ./apps/brics-portal
    container_name: smarthealth-brics-portal
    ports:
      - "3001:3001"

volumes:
  pgdata:
